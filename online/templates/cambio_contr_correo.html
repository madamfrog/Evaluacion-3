{% extends "componentes/header.html" %}
{% load static %}
{% block title %}Cambio Contraseña{% endblock %}


{% block content %}

<div class="container d-flex flex-column justify-content-center align-items-center" style="height: 30rem;">
  <h1 class="text-center">Cambio de Contraseña</h1>
  <form class="mt-5 w-50" method="post" action="{% url 'password-reset-email' %}">
    {% csrf_token %}
    <div>
      <label for="correo" class="form-label">Correo de verificación</label>
      <input class="form-control" id="correo" type="email" placeholder="Ingrese el correo" name="correo" required/>
    </div>
  </form>
</div>

{% endblock %}
