<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>Cambio de Contraseña - Call Center Library</title>
  <style>
    body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
    img { border: 0; line-height: 100%; }
    a { text-decoration: none; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .email-padding { padding-left: 20px !important; padding-right: 20px !important; }
      .email-button a { display: block !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f8f9fa; font-family: Arial, Helvetica, sans-serif;">

  <!-- Wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8f9fa" style="background-color: #f8f9fa; width: 100%;">
    <tr>
      <td align="center" style="padding: 40px 12px;">

        <!-- Tarjeta -->
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="width: 600px; max-width: 600px; background-color: #ffffff; border-radius: 30px; overflow: hidden;">

          <!-- Header -->
          <tr>
            <td align="center" bgcolor="#4E31E1" style="background-color: #4E31E1; padding: 24px 20px;">
              <h1 style="margin: 0; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; line-height: 1.3;">
                Call Center Library
              </h1>
            </td>
          </tr>

          <!-- Cuerpo -->
          <tr>
            <td class="email-padding" align="center" style="padding: 40px 48px;">

              <h2 style="margin: 0 0 16px 0; color: #4E31E1; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; line-height: 1.3;">
                Cambio de Contraseña
              </h2>

              <p style="margin: 0 0 28px 0; color: #6c757d; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 24px;">
                Recibimos una solicitud para cambiar la contraseña de tu cuenta. Haz clic en el siguiente botón para continuar.
              </p>

              <!-- Botón -->
              <table role="presentation" class="email-button" cellpadding="0" cellspacing="0" border="0" align="center" style="margin: 0 auto;">
                <tr>
                  <td align="center" bgcolor="#673de6" style="background-color: #673de6; border-radius: 8px;">
                    <a href="{{ link }}" target="_blank" style="display: inline-block; padding: 14px 32px; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; line-height: 20px; text-decoration: none; border-radius: 8px;">
                      Cambiar Contraseña
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin: 28px 0 0 0; color: #8a8f95; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 20px;">
                Si tú no solicitaste este cambio, ignora este mensaje.
              </p>

            </td>
          </tr>

        </table>
        <!-- /Tarjeta -->

      </td>
    </tr>
  </table>
  <!-- /Wrapper -->

</body>
</html>
