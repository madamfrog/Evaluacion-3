{% extends "componentes/header.html" %}
{% load static %}

{% block title %}Cerrar Sesión{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card card-purple text-center">
                <div class="card-header bg-purple text-white">
                    <h4 class="mb-0"><i class="fas fa-sign-out-alt me-2"></i>Sesión Cerrada</h4>
                </div>
                <div class="card-body">
                    <p class="mb-3">Has cerrado sesión exitosamente</p>
                    <p class="mb-2">¿Deseas <a href="{% url 'Login' %}" class="text-purple fw-bold">iniciar sesión</a> nuevamente?</p>
                    <p class="mb-0">O puedes <a href="{% url 'index' %}" class="text-purple fw-bold">volver al inicio</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
